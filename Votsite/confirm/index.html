      section
      {

        margin: 10px;
      }
      .sign {
        height: 100px;
        width: 100px;
        margin-top: 30px;
        border-radius: 50px;
        margin: 40px;
        cursor: pointer;
      }
      .cycle {
        background-color: white;
      }
      .sign:hover {
  transform: scale(1.1);
  transition: 0.2s;
}
    </style>
  </head>
  <body>
    <section class="Candidatesign">

      <!-- four -->
     <a href="javascript:void(0)"> <img src="soil.png" alt="soillogo" class="sign" /></a>
    </section>


    <script>

const signs = document.querySelectorAll(".sign");
// check on page load
if (localStorage.getItem("voted")) {
  disableAll();
}

signs.forEach(sign => {
  sign.addEventListener("click", (e) => {
    e.preventDefault();

    //  block if already voted
    if (localStorage.getItem("voted") === "true") {
      alert("You have already voted!");
      return;
    }

    //  save vote
    localStorage.setItem("voted", "true");

    // highlight selected
    sign.style.border = "4px solid green";
    sign.style.opacity = "0.6";

    // disable all
    disableAll();

    alert("Vote confirmed!");
  });
});

function disableAll() {
  signs.forEach(s => {
    s.style.pointerEvents = "none"; // disable clicks
    s.style.opacity = "0.5";

    // extra safety: remove click events
    s.replaceWith(s.cloneNode(true));
  });
}




    </script>
  </body>
</html>
